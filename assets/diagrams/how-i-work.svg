<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">How I work</title>
  <desc id="desc">a simple loop I can observe and improve. Understand to Build small to Validate to Improve.</desc>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#806F62" fill-opacity=".72"/>
    </marker>
  </defs>

  <style>
    .card {
      animation: cardPulse 6.2s ease-in-out infinite;
      animation-delay: var(--delay);
    }
    .stepDot {
      animation: dotPulse 6.2s ease-in-out infinite;
      animation-delay: var(--delay);
      transform-box: fill-box;
      transform-origin: center;
    }
    .label {
      animation: labelPulse 6.2s ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes cardPulse {
      0%, 12%, 100% { stroke-opacity: .48; fill-opacity: .055; }
      4%, 8% { stroke-opacity: .98; fill-opacity: .14; }
    }
    @keyframes dotPulse {
      0%, 12%, 100% { opacity: .72; transform: scale(1); }
      4%, 8% { opacity: 1; transform: scale(1.22); }
    }
    @keyframes labelPulse {
      0%, 12%, 100% { opacity: .86; }
      4%, 8% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .stepDot, .label { animation: none; }
    }
  </style>

  <rect width="1200" height="190" rx="22" fill="#1A120E"/>
  <rect x="1" y="1" width="1198" height="188" rx="21" fill="none" stroke="#4B372C" stroke-opacity=".42"/>

  <text x="600" y="29" text-anchor="middle" fill="#E8D8C8"
        font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
        font-size="17" font-weight="650">How I work</text>
  <text x="600" y="48" text-anchor="middle" fill="#A99583"
        font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
        font-size="11.5" font-weight="450">a simple loop I can observe and improve</text>

  
    <line x1="305.0" y1="99" x2="316.0" y2="99"
          stroke="#806F62" stroke-opacity=".52" stroke-width="1.35" marker-end="url(#arrow)"/>
    <line x1="594.0" y1="99" x2="605.0" y2="99"
          stroke="#806F62" stroke-opacity=".52" stroke-width="1.35" marker-end="url(#arrow)"/>
    <line x1="883.0" y1="99" x2="894.0" y2="99"
          stroke="#806F62" stroke-opacity=".52" stroke-width="1.35" marker-end="url(#arrow)"/>
  
    <g class="node n1" style="--delay:0.00s">
      <rect class="card" x="32.0" y="63" width="269.0" height="72" rx="15"
            fill="#7F9BC8" fill-opacity=".055" stroke="#7F9BC8" stroke-opacity=".48" stroke-width="1.25"/>
      <circle class="stepDot" cx="166.5" cy="82" r="6.2" fill="#7F9BC8" fill-opacity=".78"/>
      <text x="166.5" y="85.2" text-anchor="middle" fill="#1A120E"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="8.5" font-weight="800">01</text>
      <text class="label" x="166.5" y="113" text-anchor="middle" fill="#FFF7ED"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="14.5" font-weight="620">Understand</text>
    </g>
    <g class="node n2" style="--delay:1.05s">
      <rect class="card" x="321.0" y="63" width="269.0" height="72" rx="15"
            fill="#D1AD62" fill-opacity=".055" stroke="#D1AD62" stroke-opacity=".48" stroke-width="1.25"/>
      <circle class="stepDot" cx="455.5" cy="82" r="6.2" fill="#D1AD62" fill-opacity=".78"/>
      <text x="455.5" y="85.2" text-anchor="middle" fill="#1A120E"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="8.5" font-weight="800">02</text>
      <text class="label" x="455.5" y="113" text-anchor="middle" fill="#FFF7ED"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="14.5" font-weight="620">Build small</text>
    </g>
    <g class="node n3" style="--delay:2.10s">
      <rect class="card" x="610.0" y="63" width="269.0" height="72" rx="15"
            fill="#78A883" fill-opacity=".055" stroke="#78A883" stroke-opacity=".48" stroke-width="1.25"/>
      <circle class="stepDot" cx="744.5" cy="82" r="6.2" fill="#78A883" fill-opacity=".78"/>
      <text x="744.5" y="85.2" text-anchor="middle" fill="#1A120E"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="8.5" font-weight="800">03</text>
      <text class="label" x="744.5" y="113" text-anchor="middle" fill="#FFF7ED"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="14.5" font-weight="620">Validate</text>
    </g>
    <g class="node n4" style="--delay:3.15s">
      <rect class="card" x="899.0" y="63" width="269.0" height="72" rx="15"
            fill="#78A883" fill-opacity=".055" stroke="#78A883" stroke-opacity=".48" stroke-width="1.25"/>
      <circle class="stepDot" cx="1033.5" cy="82" r="6.2" fill="#78A883" fill-opacity=".78"/>
      <text x="1033.5" y="85.2" text-anchor="middle" fill="#1A120E"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="8.5" font-weight="800">04</text>
      <text class="label" x="1033.5" y="113" text-anchor="middle" fill="#FFF7ED"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="14.5" font-weight="620">Improve</text>
    </g>

  <text x="600" y="169" text-anchor="middle" fill="#A99583"
        font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
        font-size="12.5">learn · validate · adjust · repeat</text>
</svg>