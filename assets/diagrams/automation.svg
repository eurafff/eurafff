<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Automation</title>
  <desc id="desc">understand the process before automating it. Manual to Understand to Map to Standardize to Automate to Observe to Improve.</desc>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#806F62" fill-opacity=".72"/>
    </marker>
  </defs>

  <style>
    .card {
      animation: cardPulse 9.4s ease-in-out infinite;
      animation-delay: var(--delay);
    }
    .stepDot {
      animation: dotPulse 9.4s ease-in-out infinite;
      animation-delay: var(--delay);
      transform-box: fill-box;
      transform-origin: center;
    }
    .label {
      animation: labelPulse 9.4s ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes cardPulse {
      0%, 12%, 100% { stroke-opacity: .48; fill-opacity: .055; }
      4%, 8% { stroke-opacity: .98; fill-opacity: .14; }
    }
    @keyframes dotPulse {
      0%, 12%, 100% { opacity: .72; transform: scale(1); }
      4%, 8% { opacity: 1; transform: scale(1.22); }
    }
    @keyframes labelPulse {
      0%, 12%, 100% { opacity: .86; }
      4%, 8% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .stepDot, .label { animation: none; }
    }
  </style>

  <rect width="1200" height="190" rx="22" fill="#1A120E"/>
  <rect x="1" y="1" width="1198" height="188" rx="21" fill="none" stroke="#4B372C" stroke-opacity=".42"/>

  <text x="600" y="29" text-anchor="middle" fill="#E8D8C8"
        font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
        font-size="17" font-weight="650">Automation</text>
  <text x="600" y="48" text-anchor="middle" fill="#A99583"
        font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
        font-size="11.5" font-weight="450">understand the process before automating it</text>

  
    <line x1="181.1" y1="99" x2="192.1" y2="99"
          stroke="#806F62" stroke-opacity=".52" stroke-width="1.35" marker-end="url(#arrow)"/>
    <line x1="346.3" y1="99" x2="357.3" y2="99"
          stroke="#806F62" stroke-opacity=".52" stroke-width="1.35" marker-end="url(#arrow)"/>
    <line x1="511.4" y1="99" x2="522.4" y2="99"
          stroke="#806F62" stroke-opacity=".52" stroke-width="1.35" marker-end="url(#arrow)"/>
    <line x1="676.6" y1="99" x2="687.6" y2="99"
          stroke="#806F62" stroke-opacity=".52" stroke-width="1.35" marker-end="url(#arrow)"/>
    <line x1="841.7" y1="99" x2="852.7" y2="99"
