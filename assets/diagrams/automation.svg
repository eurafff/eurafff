      <circle class="stepDot" cx="1095.4" cy="82" r="6.2" fill="#78A883" fill-opacity=".78"/>
      <text x="1095.4" y="85.2" text-anchor="middle" fill="#1A120E"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
