    <line x1="1006.9" y1="99" x2="1017.9" y2="99"
          stroke="#806F62" stroke-opacity=".52" stroke-width="1.35" marker-end="url(#arrow)"/>
  
    <g class="node n1" style="--delay:0.00s">
      <rect class="card" x="32.0" y="63" width="145.1" height="72" rx="15"
            fill="#7F9BC8" fill-opacity=".055" stroke="#7F9BC8" stroke-opacity=".48" stroke-width="1.25"/>
      <circle class="stepDot" cx="104.6" cy="82" r="6.2" fill="#7F9BC8" fill-opacity=".78"/>
      <text x="104.6" y="85.2" text-anchor="middle" fill="#1A120E"
