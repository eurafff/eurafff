  <text x="600" y="169" text-anchor="middle" fill="#A99583"
        font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
        font-size="12.5">understand first · automate gradually · keep the process observable</text>
</svg>