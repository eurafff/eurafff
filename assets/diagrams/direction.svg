      <circle class="stepDot" cx="889.0" cy="82" r="6.2" fill="#C47A72" fill-opacity=".78"/>
      <text x="889.0" y="85.2" text-anchor="middle" fill="#1A120E"
            font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="8.5" font-weight="800">05</text>
      <text class="label" x="889.0" y="113" text-anchor="middle" fill="#FFF7ED"
